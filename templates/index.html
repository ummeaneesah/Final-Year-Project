<!DOCTYPE html>
<html>    
<<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css>
    <title>Supplement Scheduler</title>
</head>
<body>
    <h1>Supplement Scheduler</h1>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <h3>Select Supplements</h3>

        <select name="products" multiple="multiple" id="supplement-select" style="width: 100%;">
        {% for product in products %}
        <option value="{{ product }}">{{ product }}</option>
    {% endfor %}
        </select>
        <div style="margin-bottom: 20px;">
    <label for="supplement-select"><b>Supplements</b></label>
    <select name="products" multiple="multiple" id="supplement-select" style="width: 100%;"></select>
</div>
      
        <h3>Cycle Options</h3>
        <input type="checkbox" name="use_cycle" value="yes">
        <label>Enable supplement cycling (30 days on / 7 days off)</label>
        <br><br>

        <label>Cycle start date:</label>
        <input type="date" name="cycle_start">
        
        <h3>Doses</h3>
        {% for row in range(products|length) %}
            <label>Dose (row {{ row }}):</label>
            <input type="text" name="dose_{{ row }}"><br>
        {% endfor %}

        <br>
        <button type="submit">Generate Schedule</button>
    </form>
</body>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
  $(document).ready(function () {
      $('#supplement-select').select2({
          placeholder: "Type to search supplements",
          allowClear: true
      });
  });
</script>

</html>
